[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wowflipper"
version = "0.1.0"
description = "Local retail auction research"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.2", "requests==2.32.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
wowflipper = "wowflipper.__main__:main"

[tool.setuptools.packages.find]
include = ["wowflipper*"]

[tool.setuptools.package-data]
wowflipper = ["templates/*", "static/*"]
